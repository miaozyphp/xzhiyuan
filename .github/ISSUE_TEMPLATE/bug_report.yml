name: Bug report
description: 报告可复现的安装、主题或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请勿提交 Codex 对话、完整日志、访问令牌或未脱敏的个人路径。安全漏洞请按照 SECURITY.md 私密报告。
  - type: input
    id: app-version
    attributes:
      label: x纸鸢版本
      placeholder: 例如：当前最新版本
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex版本
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows版本
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 安装方式
      options:
        - 安装版
        - 便携版
        - 源码运行
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、连续的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已使用最新版本复现并搜索过已有 Issue。
          required: true
        - label: 我已移除对话内容、用户名、个人路径和访问令牌。
          required: true
