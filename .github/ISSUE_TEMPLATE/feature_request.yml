name: Feature request
description: 提议新的主题能力或工作流改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明目前遇到的实际问题，而不只是期望的按钮或实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: rights
    attributes:
      label: 素材确认
      options:
        - label: 此提议不要求项目分发未经授权的角色、品牌或第三方素材。
          required: true
