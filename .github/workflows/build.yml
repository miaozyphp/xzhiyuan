name: build

on:
  push:
    branches: [main, feature/macos]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.423
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Test and build Windows release
        shell: powershell
        run: .\scripts\build-release.ps1

      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XZhiYuan-release
          path: artifacts/release
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.423
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Test and build macOS release
        shell: bash
        run: |
          chmod +x scripts/build-macos.sh
          scripts/build-macos.sh

      - name: Mount and launch candidate package
        shell: bash
        run: |
          chmod +x scripts/test-macos-package.sh
          shopt -s nullglob
          packages=(artifacts/release/XZhiYuan-Setup-*-macos-arm64.dmg)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one ARM64 DMG, found ${#packages[@]}." >&2
            exit 1
          fi
          scripts/test-macos-package.sh "${packages[0]}"

      - name: Upload macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XZhiYuan-macos-release
          path: |
            artifacts/release/XZhiYuan-Setup-*-macos-arm64.dmg
            artifacts/release/XZhiYuan-*-macos-arm64.zip
            artifacts/release/XZhiYuan-macos-arm64-SHA256SUMS.txt
          if-no-files-found: error
