name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.423
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Verify tag version
        shell: powershell
        run: |
          $expected = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml] $project = Get-Content 'src\ThemeStudio.App\ThemeStudio.App.csproj' -Raw
          $actual = @($project.Project.PropertyGroup | ForEach-Object { [string] $_.Version }) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1
          if ($actual -ne $expected) {
            throw "Tag version $expected does not match project version $actual."
          }

      - name: Build unsigned preview release
        shell: powershell
        run: .\scripts\build-release.ps1 -ReleaseChannel preview

      - name: Attest release provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: artifacts/release/*

      - name: Publish unsigned GitHub prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $productName = 'x' + [char]0x7EB8 + [char]0x9E22
          $files = Get-ChildItem 'artifacts\release' -File | Select-Object -ExpandProperty FullName
          & gh release create $env:GITHUB_REF_NAME @files `
            --verify-tag `
            --prerelease `
            --notes-file 'docs\unsigned-release-notice.md' `
            --title "$productName $env:GITHUB_REF_NAME unsigned preview"
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release creation failed.'
          }
